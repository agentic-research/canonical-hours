version: '3'

includes:
  release:
    taskfile: ../../tasks/release-ts.yml
    vars:
      TARGET_PKG: package.json
      TAG_TEMPLATE: vespers-v%s
      PKG_NAME: "@agentic-research/vespers-core"

tasks:
  build:
    desc: "Build the portable vespers-core package."
    cmds:
      - pnpm run build

  typecheck:
    desc: "Type-check vespers-core with its workers-compatible configuration."
    cmds:
      - pnpm exec tsc --noEmit -p tsconfig.json

  test:
    desc: "Run vespers-core unit and invariant tests."
    cmds:
      - pnpm run test

  test:package:
    desc: "Build vespers-core and prove its published ESM entrypoint imports under Node."
    cmds:
      - task: release:test:package

  test:workerd:
    desc: "Run vespers-core inside a simulated workerd runtime."
    cmds:
      - pnpm run test:workerd

  check:
    desc: "Run the deterministic vespers-core package gate."
    deps:
      - typecheck
      - test
      - test:package
      - test:workerd

  publish:
    desc: "Build, test, and publish vespers-core to npm."
    cmds:
      - task: release:publish

  ci-publish:
    desc: "Build, test, and publish vespers-core to npm from CI with provenance."
    cmds:
      - task: release:ci-publish

  bump:
    desc: "Interactively bump and tag vespers-core."
    cmds:
      - task: release:bump
